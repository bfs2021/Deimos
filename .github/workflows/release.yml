name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verify tag matches the project version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with CMake project version
        run: |
          version="$(grep -m1 -E '^[[:space:]]+VERSION[[:space:]]+[0-9]' CMakeLists.txt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "${version}" ]; then
            echo "Could not read the project version from CMakeLists.txt" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the project version v${version}" >&2
            exit 1
          fi

  linux:
    name: Linux artifacts
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: cmake --preset linux-release -DDEIMOS_WARNINGS_AS_ERRORS=ON -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        run: ctest --preset linux-release

      - name: Stage installation
        run: cmake --install out/build/linux-release --prefix staging --strip

      - name: Package
        run: tar -czf "Deimos-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C staging .

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: Deimos-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows artifacts
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64 -DDEIMOS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage installation
        run: cmake --install build --config Release --prefix staging --strip

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath "Deimos-$env:GITHUB_REF_NAME-windows-x86_64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Deimos-*-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Deimos ${GITHUB_REF_NAME}" \
            --generate-notes
